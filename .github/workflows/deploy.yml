
name: Publicar Impulso Digital en GitHub Pages

on:
  push:
    branches:
      - migracion-react
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend-react
        run: npm ci

      - name: Compilar React
        working-directory: frontend-react
        env:
          VITE_API_URL: https://impulso-digital-gj7u.onrender.com
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend-react/dist

      - name: Publicar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
